<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ploynaja Collection | เสื้อกันหนาวพรีเมียม</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="nav-header">
      <a href="index.html" class="brand-logo">ploynaja</a>
      <a href="index.html" class="btn btn-secondary">กลับหน้าแรก</a>
    </header>

    <h2 style="text-align: center; margin-bottom: 0.5rem;">คอลเลกชันเสื้อกันหนาวทั้งหมด</h2>
    <p style="text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.95rem;">
      เลือกเสื้อกันหนาวสไตล์ที่ใช่ ตอบโจทย์ทุกการแต่งตัวในแบบของคุณ
    </p>
    
    <div id="filter-bar">
      <button data-mood="all">ทั้งหมด</button>
      <button data-mood="hoodie">Hoodie</button>
      <button data-mood="sweatshirt">Sweatshirt</button>
      <button data-mood="jacket">Jacket</button>
      <button data-mood="fleece">Fleece</button>
    </div>

    <div id="product-list" class="product-grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
