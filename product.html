<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BareFit Collection | เลือกซื้อเสื้อผ้าพรีเมียม นุ่ม ใส่สบาย</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="nav-header">
      <a href="index.html" class="brand-logo">BareFit</a>
      <a href="index.html" class="btn btn-secondary">กลับหน้าแรก</a>
    </header>

    <h2 style="text-align: center; margin-bottom: 0.5rem;">คอลเลกชันเสื้อผ้าทั้งหมด</h2>
    <p style="text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.95rem;">เลือกเสื้อสไตล์ที่ใช่ ตอบโจทย์ทุกการสวมใส่ในแบบของคุณ</p>
    
    <div id="filter-bar">
      <button data-mood="all">ทั้งหมด</button>
      <button data-mood="seamless">Seamless (ไร้ตะเข็บ)</button>
      <button data-mood="cotton">Cotton (คอตตอนแท้)</button>
      <button data-mood="sport">Sport Flex (แอคทีฟ)</button>
      <button data-mood="lounge">Lounge & Set (ใส่นอน)</button>
    </div>

    <div id="product-list" class="product-grid"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
